# ZM Phish Hunter settings. Edit this file to add brands or change how strict it is.

[settings]
# Scores: 70+ is "high" (sent as an alert), 50+ is "medium" (report only), below that is ignored.
high_score = 70
medium_score = 50

# Endings to try for every name.
try_endings = ["com", "net", "org", "co", "info", "online", "top", "xyz", "shop", "site", "live",
               "app", "store", "click", "vip", "co.zm", "com.zm", "zm"]

# Words to try before and after every name (zanaco-login, secure-zanaco…).
try_lure_words = ["login", "online", "secure", "verify", "update", "bonus", "promo", "rewards",
                  "support", "pay", "wallet", "money", "momo", "loans", "app", "portal"]

# How many DNS lookups to run at the same time.
dns_workers = 40

# A site whose first certificate is this recent gets +10 (new sites are more suspicious).
fresh_days = 30

# crt.sh (certificate lookups) is a free public service and is often slow: be patient and polite.
search_timeout = 90
search_retries = 2
seconds_between_searches = 6
max_certificate_lookups = 25

# Real websites that use a brand's name but aren't scams (a football club, a supplier…).
# Add a name here when the report keeps flagging something you have checked is genuine.
ignore_domains = ["zescounited.co.zm", "zescounitedfc.co.zm"]

# Words that show a name is aimed at Zambia. Brands marked needs_zambia_context
# (used in many countries) only count when one of these, or a .zm ending, is present.
zambia_words = ["zambia", "zambian", "zm", "lusaka", "kwacha", "zed"]

# Words scammers add to make a link look official or urgent.
lure_words = ["login", "signin", "secure", "security", "verify", "verification", "update", "account",
              "wallet", "pay", "payment", "bonus", "promo", "reward", "rewards", "support", "help",
              "kyc", "claim", "free", "gift", "reversal", "refund", "portal", "online", "app", "apply",
              "loan", "loans", "winner", "prize", "unlock", "confirm", "auth", "service", "customer"]

# Cheap endings that turn up often in scam links.
risky_endings = ["top", "xyz", "shop", "online", "site", "click", "live", "icu", "cfd", "sbs", "vip",
                 "buzz", "info", "store", "cc", "tk", "ml", "ga", "cf", "gq", "help", "support",
                 "lol", "quest", "rest", "cyou", "bond", "monster", "today", "life", "world", "club"]


# ─────────────────────────────────────────────────────────────
#  Brands to protect
#  - label:            shown in the report
#  - names:            spellings to look for inside new domain names
#  - official_domains: the real websites (never reported).  CHECK THESE - a wrong
#                      entry here means the real site gets reported as fake.
#  - needs_zambia_context: true for names used in many countries (MTN, Absa…)
# ─────────────────────────────────────────────────────────────

[[brands]]
label = "Zanaco"
names = ["zanaco"]
official_domains = ["zanaco.co.zm"]

[[brands]]
label = "ZESCO"
names = ["zesco"]
official_domains = ["zesco.co.zm"]

[[brands]]
label = "Zamtel"
names = ["zamtel", "zamtelmoney", "zamtelkwacha"]
official_domains = ["zamtel.zm", "zamtel.co.zm"]

[[brands]]
label = "Zambia Revenue Authority"
names = ["zra", "zraonline", "zambiarevenue"]
official_domains = ["zra.org.zm"]

[[brands]]
label = "NAPSA"
names = ["napsa", "enapsa"]
official_domains = ["napsa.co.zm"]

[[brands]]
label = "Bank of Zambia"
names = ["bankofzambia", "boz"]
official_domains = ["boz.zm"]
needs_zambia_context = true

[[brands]]
label = "Indo Zambia Bank"
names = ["indozambia", "izb"]
official_domains = ["izb.co.zm"]
needs_zambia_context = true

[[brands]]
label = "Airtel Money"
names = ["airtel", "airtelmoney"]
official_domains = ["airtel.co.zm", "airtel.africa", "airtel.com", "airtel.in"]
needs_zambia_context = true

[[brands]]
label = "MTN MoMo"
names = ["mtn", "mtnmomo", "momo"]
official_domains = ["mtn.zm", "mtn.co.zm", "mtn.com"]
needs_zambia_context = true

[[brands]]
label = "Absa Zambia"
names = ["absa"]
official_domains = ["absa.co.zm", "absa.africa", "absa.co.za"]
needs_zambia_context = true

[[brands]]
label = "FNB Zambia"
names = ["fnb", "fnbzambia"]
official_domains = ["fnbzambia.co.zm", "fnb.co.zm", "fnb.co.za"]
needs_zambia_context = true

[[brands]]
label = "Stanbic Zambia"
names = ["stanbic", "stanbicbank"]
official_domains = ["stanbicbank.co.zm", "stanbicbank.com", "standardbank.com"]
needs_zambia_context = true
