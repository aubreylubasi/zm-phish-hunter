name: ZM Phish Hunter

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [hunt, dry-run, check]
        default: hunt

permissions:
  contents: write

concurrency:
  group: zm-phish-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python tests/test_hunter.py
      - name: Hunt
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            check)   python hunter.py --check ;;
            dry-run) python hunter.py --dry-run ;;
            *)       python hunter.py ;;
          esac
      - name: Save findings
        if: github.event.inputs.mode != 'check' && github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "zm-phish-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add state findings
          git diff --cached --quiet || git commit -m "Update findings [skip ci]"
          git push
